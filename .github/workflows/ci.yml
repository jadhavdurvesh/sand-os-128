name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -W error -m unittest discover -s tests
      - run: python3 -m veylith boot | grep -q 295232799039604140847618609643520000000

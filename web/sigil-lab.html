<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Sigil Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a small desktop. Menu bar on top, draggable windows on a dusk wallpaper, dock at the bottom.
   Look: committed dark single theme (a desktop at night); every colour comes from the tokens below. */
:root{
  --bg:#0d1220; --bg2:#141b30; --win:#12182a; --bar:#1a2340; --line:#27325a; --fg:#dbe3f5; --mute:#8d9bbd;
  --caller:#6aa3ff; --service:#f2b24c; --kernel:#8d9bbd; --ok:#5fd39a; --bad:#ff7a8a; --accent:#8f7bff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);overflow:hidden;
  background-image:radial-gradient(900px 520px at 78% 8%,#2a2f6a55,transparent 60%),radial-gradient(700px 500px at 8% 92%,#0f4a6a55,transparent 60%),linear-gradient(180deg,#0d1220,#10162b)}
.menubar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:30px;display:flex;align-items:center;gap:18px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  background:#0a0f1ecc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);z-index:50}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0a0f1e;z-index:60}
.menubar b{color:var(--fg);font-weight:600}.menubar .sp{flex:1}.menubar code{font-family:var(--mono);font-size:11.5px}
.desk{position:fixed;inset:calc(30px + env(safe-area-inset-top,0px)) 0 0 0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px #0008;overflow:hidden;min-width:0}
.win.hidden{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.tb:active{cursor:grabbing}.tb .lights{display:flex;gap:6px}.tb i{width:11px;height:11px;border-radius:50%;background:#33406e;display:block}
.tb i.x{background:#e0607a;cursor:pointer}.tb h2{margin:0 0 0 6px;font:500 12.5px var(--sans);color:var(--fg);letter-spacing:.02em}
.body{padding:14px;overflow:auto;flex:1;min-height:0}
button,select{font:inherit;color:var(--fg);background:#1d2748;border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer}
button:hover{background:#25315c}button:focus-visible,select:focus-visible,.bit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:#0d1220;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mono{font-family:var(--mono)}.mute{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:#1b2547;font-size:12px;color:#cfd9f3}.pill.ok{background:#12352a;color:var(--ok)}.pill.bad{background:#3b1a25;color:var(--bad)}
pre{margin:0;font:12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
.term{background:#080c18;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:150px;color:#b5f3cf}
.term .p{color:var(--caller)}
/* stepper */
.stp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.list{display:grid;gap:2px;font:12.5px var(--mono)}
.ins{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:3px 8px;border-radius:6px;border-left:3px solid transparent;color:var(--mute)}
.ins.caller{border-color:var(--caller)}.ins.service{border-color:var(--service)}.ins.kernel{border-color:var(--kernel)}
.ins.done{color:var(--fg)}.ins.cur{background:#212c55;color:#fff}
.regs{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:12.5px var(--mono)}
.regs .k{color:var(--mute)}.regs .v{transition:background .25s}.regs .v.ch{background:#3a3a1d}
.dom{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#0d1220}
.dom.caller{background:var(--caller)}.dom.service{background:var(--service)}.dom.kernel{background:var(--kernel)}
.cap{margin-top:10px;padding:10px 12px;border-radius:8px;background:#161e3a;border:1px solid var(--line);min-height:62px}
h3{margin:0 0 6px;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* inspector */
.seg{display:flex;flex-wrap:wrap;gap:10px 14px}
.field{flex:0 0 auto}.field label{display:block;font:11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.bits{display:grid;gap:2px}
.bit{width:15px;height:20px;border:1px solid #2c3866;background:#171f3d;border-radius:3px;padding:0;font:10px var(--mono);color:var(--mute)}
.bit.one{background:#2b3d8a;color:#fff}.bit.mac{border-color:#5b4fb5}.bit.perm{border-color:#2f8f66}.bit.exp{border-color:#9a7a2a}.bit.base{border-color:#2d5d9a}
.bit.flip{outline:2px solid var(--bad)}
.verdict{font:600 15px var(--sans);margin:10px 0 4px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
/* cost */
.bar2{display:grid;grid-template-columns:minmax(120px,210px) 1fr 60px;gap:10px;align-items:center;margin:8px 0}
.bar2 .t{height:16px;background:#1b2547;border-radius:4px;overflow:hidden}.bar2 .t div{height:100%;background:var(--caller);border-radius:4px;min-width:3px}
.bar2.k .t div{background:var(--service)}.bar2 span.n{text-align:right;font-family:var(--mono)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px 10px;background:#0a0f1ecc;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;z-index:40}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:10px;font-size:11.5px;min-width:74px}
.dock svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock button.open{border-color:var(--accent)}
@media (max-width:760px){
  .win{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;margin:8px 0}
  .desk{overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
  .stp{grid-template-columns:minmax(0,1fr)}.tb{cursor:default}
  .menubar .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){.regs .v{transition:none}}
</style>

0","v9":"0x0","v10":"0xbad","v13":"0x0","v14":"0x0"}},{"pc":16464,"asm":"mv v11, v1","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x7","v2":"0x4","v6":"0x0","v9":"0x99","v10":"0x77","v13":"0x0","v14":"0x0"}},{"pc":16480,"asm":"sys 1","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x7","v2":"0x4","v6":"0x0","v9":"0x99","v10":"0x77","v13":"0x0","v14":"0x0"}},{"pc":18528,"asm":"(trap: SYSCALL, back in the kernel)","domain":"kernel","priv":0,"clink":"0","regs":{"v1":"0x7","v2":"0x4","v6":"0x0","v9":"0x99","v10":"0x77","v13":"0x0","v14":"0x0"}}]},"shared":{"title":"Shared-register gate call (ccall / cretn)","steps":[{"pc":16384,"asm":"li v9, 0x99","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x6000","v2":"0x4800","v6":"0x0","v9":"0x0","v10":"0x0","v13":"0x0","v14":"0x0"}},{"pc":16400,"asm":"li v10, 0x77","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x6000","v2":"0x4800","v6":"0x0","v9":"0x99","v10":"0x0","v13":"0x0","v14":"0x0"}},{"pc":16416,"asm":"li v1, 0x3","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x6000","v2":"0x4800","v6":"0x0","v9":"0x99","v10":"0x77","v13":"0x0","v14":"0x0"}},{"pc":16432,"asm":"li v2, 0x4","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x3","v2":"0x4800","v6":"0x0","v9":"0x99","v10":"0x77","v13":"0x0","v14":"0x0"}},{"pc":16448,"asm":"ccall v6, v5","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x3","v2":"0x4","v6":"0x0","v9":"0x99","v10":"0x77","v13":"0x0","v14":"0x0"}},{"pc":18432,"asm":"mv v13, v10","domain":"service","priv":1,"clink":"0x4050","regs":{"v1":"0x3","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0x77","v13":"0x0","v14":"0x0"}},{"pc":18448,"asm":"mv v14, v9","domain":"service","priv":1,"clink":"0x4050","regs":{"v1":"0x3","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0x77","v13":"0x77","v14":"0x0"}},{"pc":18464,"asm":"add v1, v1, v2","domain":"service","priv":1,"clink":"0x4050","regs":{"v1":"0x3","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0x77","v13":"0x77","v14":"0x99"}},{"pc":18480,"asm":"li v10, 0xbad","domain":"service","priv":1,"clink":"0x4050","regs":{"v1":"0x7","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0x77","v13":"0x77","v14":"0x99"}},{"pc":18496,"asm":"cretn","domain":"service","priv":1,"clink":"0x4050","regs":{"v1":"0x7","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0xbad","v13":"0x77","v14":"0x99"}},{"pc":16464,"asm":"mv v11, v1","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x7","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0xbad","v13":"0x77","v14":"0x99"}},{"pc":16480,"asm":"sys 1","domain":"caller","priv":1,"clink":"0","regs":{"v1":"0x7","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0xbad","v13":"0x77","v14":"0x99"}},{"pc":18528,"asm":"(trap: SYSCALL, back in the kernel)","domain":"kernel","priv":0,"clink":"0","regs":{"v1":"0x7","v2":"0x4","v6":"0xd19e8712920708000000000000004800","v9":"0x99","v10":"0xbad","v13":"0x77","v14":"0x99"}}]}},"examples":{"gate":{"console":"[kernelloom] Veylith 128-Native v1 booting user program\ngate: ok\n[kernelloom] user exit 0","glyphs":1970,"exit":0,"c_machine_identical":true,"source":"; Sigil call gate: a protected counter service reached by a 2-Glyph call, with no kernel involvement per call.\n; The service owns a 256-byte region: its code is at the region base (the ONLY entry point a gate allows) and its counter\n; lives inside the region. The client seals the region capability into a gate, enters capability mode, and can then reach the\n; service only through ccall: it cannot read or write the counter, and cannot jump anywhere else in the service.\n.equ USER_BASE, 0x10000\n.org USER_BASE\n_start:\n    li   sp, 0x1F000\n    la   v2, svc\n    li   v3, 8                   ; 2^8 = 256 bytes, naturally aligned (see .align below)\n    li   v4, 7 | 8               ; READ | WRITE | NARROW | GATE\n    li   v1, 10\n    sys  0                       ; capget\n    cseal v30, v1                ; the gate: an opaque token; its base is the one entry point\n    li   v1, 11\n    sys  0                       ; capability mode: raw loads and stores now trap\n    ccall v20, v30               ; v1 = 1\n    mv   v10, v1\n    ccall v20, v30               ; v1 = 2\n    mv   v11, v1\n    ccall v20, v30               ; v1 = 3\n    mv   v12, v1\n    li   v6, 1\n    bne  v10, v6, bad\n    li   v6, 2\n    bne  v11, v6, bad\n    li   v6, 3\n    bne  v12, v6, bad\n    la   v2, msg_ok\n    li   v3, 9\n    li   v1, 1\n    sys  0\n    li   v2, 0\n    li   v1, 2\n    sys  0\nbad:\n    la   v2, msg_bad\n    li   v3, 4\n    li   v1, 1\n    sys  0\n    li   v2, 1\n    li   v1, 2\n    sys  0\nmsg_ok:  .ascii \"gate: ok\\n\"\nmsg_bad: .ascii \"BAD\\n\"\n.align 256\nsvc:                             ; entry: v20 = the service's own data authority, delivered by ccall\n    clq  v6, [v20 + 128]\n    addi v6, v6, 1\n    csq  [v20 + 128], v6\n    mv   v1, v6\n    cretn\n.space 160\n"},"gateswitch":{"console":"[kernelloom] Veylith 128-Native v1 booting user program\ngate switching: ok\n[kernelloom] user exit 0","glyphs":6821,"exit":0,"c_machine_identical":true,"source":"; Gate calls survive context switches: the gate's return link is saved per task. Both tasks enter the same service, and the\n; service yields to the other task in the MIDDLE of the call. Each task must still return to its own caller.\n.equ USER_BASE, 0x10000\n.org USER_BASE\n_start:\n    li   sp, 0x1F000\n    la   v2, svc\n    li   v3, 8\n    li   v4, 7 | 8\n    li   v1, 10\n    sys  0                       ; capget\n    cseal v30, v1\n    li   v1, 11\n    sys  0                       ; capability mode, inherited by the worker\n    la   v2, worker\n    li   v3, 0x1E000\n    mv   v4, v30                 ; the gate token is the worker's argument\n    li   v1, 6\n    sys  0\n    mv   v24, v1\n    ccall v20, v30               ; yields inside the service, comes back here\n    mv   v10, v1\n    li   v1, 9                   ; recv the worker's result\n    sys  0\n    mv   v11, v1\n    add  v12, v10, v11\n    li   v6, 3\n    bne  v12, v6, bad            ; the two results are 1 and 2 in some order\n    beq  v10, v11, bad\n    mv   v2, v24\n    li   v1, 7\n    sys  0                       ; join\n    la   v2, msg_ok\n    li   v3, 19\n    li   v1, 1\n    sys  0\n    li   v2, 0\n    li   v1, 2\n    sys  0\nbad:\n    la   v2, msg_bad\n    li   v3, 4\n    li   v1, 1\n    sys  0\n    li   v2, 1\n    li   v1, 2\n    sys  0\nworker:\n    mv   v30, v1\n    ccall v20, v30\n    mv   v3, v1\n    li   v2, 1\n    li   v1, 8                   ; send the result to task 1; retry if its mailbox is full\nretry:\n    li   v1, 8\n    sys  0\n    li   v6, -2\n    beq  v1, v6, again\n    li   v2, 0\n    li   v1, 2\n    sys  0\nagain:\n    li   v1, 5\n    sys  0\n    li   v2, 1\n    jmp  retry\nmsg_ok:  .ascii \"gate switching: ok\\n\"\nmsg_bad: .ascii \"BAD\\n\"\n.align 256\nsvc:\n    clq  v6, [v20 + 128]\n    addi v6, v6, 1\n    csq  [v20 + 128], v6\n    li   v1, 5                   ; yield in the middle of the call\n    sys  0\n    mv   v1, v6\n    cretn\n.space 144\n"},"gateiso":{"console":"[kernelloom] Veylith 128-Native v1 booting user program\ngate isolation: ok\n[kernelloom] user exit 0","glyphs":2039,"exit":0,"c_machine_identical":true,"source":"; Isolated gate call (ccalx / cretx): the callee sees none of the caller's registers and cannot corrupt them.\n; The caller fills several registers (including sp) with secrets, calls the service with two arguments (v1, v2), and checks that\n;   - the service saw zero in every non-argument register it probed (it reports what it saw),\n;   - the service's own clobbering of those registers is invisible after the return,\n;   - the arguments arrived and the result came back in v1.\n.equ USER_BASE, 0x10000\n.org USER_BASE\n_start:\n    li   sp, 0x1F000\n    la   v2, svc\n    li   v3, 8\n    li   v4, 15                  ; READ | WRITE | NARROW | GATE\n    li   v1, 10\n    sys  0                       ; capget\n    cseal v30, v1\n    li   v1, 11\n    sys  0                       ; capability mode\n    li   v10, 0x1111\n    li   v11, 0x2222\n    li   v50, 0x5050\n    li   v100, 0x100100\n    li   v1, 7                   ; argument 1\n    li   v2, 5                   ; argument 2\n    ccalx v20, v30\n    li   v6, 12\n    bne  v1, v6, bad             ; 7 + 5, and nothing the service saw was non-zero\n    li   v6, 0\n    bne  v2, v6, bad             ; v2 carries the service's second result: the count of secrets it saw (must be 0)\n    li   v6, 0x1111\n    bne  v10, v6, bad\n    li   v6, 0x2222\n    bne  v11, v6, bad\n    li   v6, 0x5050\n    bne  v50, v6, bad\n    li   v6, 0x100100\n    bne  v100, v6, bad\n    li   v6, 0x1F000\n    bne  sp, v6, bad             ; sp came back untouched even though the service trashed it\n    la   v2, msg_ok\n    li   v3, 19\n    li   v1, 1\n    sys  0\n    li   v2, 0\n    li   v1, 2\n    sys  0\nbad:\n    la   v2, msg_bad\n    li   v3, 4\n    li   v1, 1\n    sys  0\n    li   v2, 1\n    li   v1, 2\n    sys  0\nmsg_ok:  .ascii \"gate isolation: ok\\n\"\nmsg_bad: .ascii \"BAD\\n\"\n.align 256\nsvc:                             ; v1, v2 = arguments; v20 = data capability; everything else is zero\n    add  v8, v1, v2              ; the real work\n    li   v9, 0                   ; count the caller secrets that leaked in\n    beq  v10, v0, s1\n    addi v9, v9, 1\ns1: beq  v11, v0, s2\n    addi v9, v9, 1\ns2: beq  v50, v0, s3\n    addi v9, v9, 1\ns3: beq  v100, v0, s4\n    addi v9, v9, 1\ns4: beq  sp, v0, s5\n    addi v9, v9, 1\ns5: li   v10, 0xBAD              ; now trash them: none of this may survive the return\n    li   v11, 0xBAD\n    li   v50, 0xBAD\n    li   v100, 0xBAD\n    li   sp, 0xBAD\n    mv   v1, v8\n    mv   v2, v9\n    cretx\n"},"sigil":{"console":"[kernelloom] Veylith 128-Native v1 booting user program\nHi\nsigil capabilities: ok\n[kernelloom] user exit 0","glyphs":5436,"exit":0,"c_machine_identical":true,"source":"; Sigil capabilities in Kernelloom: a worker that can reach memory ONLY through a capability it was handed.\n; Task 1 mints a 64-byte region (capget), narrows it, and passes the narrowed 128-bit capability to a worker as its spawn\n; argument. The worker enters capability mode, writes through the capability, and prints through it with cwrite.\n.equ USER_BASE, 0x10000\n.org USER_BASE\n_start:\n    li   sp, 0x1F000\n    la   v2, region\n    li   v3, 6                   ; 2^6 = 64 bytes, naturally aligned\n    li   v4, 7                   ; READ | WRITE | NARROW\n    li   v1, 10\n    sys  0                       ; capget\n    mv   v20, v1                 ; the full-region capability\n    li   v21, 1 | 5 << 8 | 32 << 16\n    cnarrow v22, v20, v21        ; READ-only window on the upper half (kept to show derivation; not handed out)\n    li   v21, 3 | 5 << 8\n    cnarrow v23, v20, v21        ; READ|WRITE, lower 32 bytes; narrowed capabilities lose NARROW, so they cannot be widened\n    la   v2, worker\n    li   v3, 0x1E000\n    mv   v4, v23                 ; the capability itself is the argument: all 128 bits travel in one register\n    li   v1, 6\n    sys  0\n    mv   v24, v1\n    li   v1, 9                   ; recv: the worker reports when it is done\n    sys  0\n    mv   v2, v24\n    li   v1, 7\n    sys  0                       ; join\n    la   v5, region\n    lq   v6, [v5 + 16]           ; plain load by task 1: the worker's 128-bit write is there\n    li   v7, 0x5349474C5F4F4B21F00DFACE0000BEEF\n    bne  v6, v7, bad\n    la   v2, msg_ok\n    li   v3, 23\n    li   v1, 1\n    sys  0\n    li   v2, 0\n    li   v1, 2\n    sys  0\nbad:\n    la   v2, msg_bad\n    li   v3, 4\n    li   v1, 1\n    sys  0\n    li   v2, 1\n    li   v1, 2\n    sys  0\n\nworker:                          ; v1 = capability to region[0..32), READ|WRITE\n    mv   v20, v1\n    li   v1, 11\n    sys  0                       ; cmode: from here on raw loads and stores trap\n    li   v6, 0x5349474C5F4F4B21F00DFACE0000BEEF\n    csq  [v20 + 16], v6          ; 128-bit store through the capability\n    li   v8, 0x48                ; \"Hi\\n\" at +0\n    csb  [v20 + 0], v8\n    li   v8, 0x69\n    csb  [v20 + 1], v8\n    li   v8, 0x0A\n    csb  [v20 + 2], v8\n    mv   v2, v20                 ; cwrite: the console buffer is named by the capability, not by a raw pointer\n    li   v3, 3\n    li   v1, 12\n    sys  0\n    li   v1, 8                   ; send \"done\" to task 1\n    li   v2, 1\n    li   v3, 1\n    sys  0\n    li   v1, 2\n    li   v2, 0\n    sys  0\n.align 64\nregion: .space 64\nmsg_ok:  .ascii \"sigil capabilities: ok\\n\"\nmsg_bad: .ascii \"BAD\\n\"\n"},"sigilforge":{"console":"[kernelloom] Veylith 128-Native v1 booting user program\n[kernelloom] user fault cause=8 tval=168811955464684315858783496655603761322","glyphs":1730,"exit":136,"c_machine_identical":true,"source":"; Sigil negative test 1: a task in capability mode tries to use a forged capability (a made-up 128-bit value).\n; The hardware raises a CAPABILITY trap and Kernelloom reports it as a user fault.\n.equ USER_BASE, 0x10000\n.org USER_BASE\n_start:\n    li   sp, 0x1F000\n    li   v1, 11\n    sys  0\n    li   v3, 0x7F0000000000000000000000000000AA       ; a plausible-looking but forged capability\n    clq  v4, [v3 + 0]\n    li   v2, 0\n    li   v1, 2\n    sys  0\n"},"sigilraw":{"console":"[kernelloom] Veylith 128-Native v1 booting user program\n[kernelloom] user fault cause=8 tval=65664","glyphs":1389,"exit":136,"c_machine_identical":true,"source":"; Sigil negative test 2: a task in capability mode attempts a raw load. Raw memory access is forbidden there.\n.equ USER_BASE, 0x10000\n.org USER_BASE\n_start:\n    li   sp, 0x1F000\n    li   v1, 11\n    sys  0\n    la   v5, data\n    lq   v4, [v5 + 0]\n    li   v2, 0\n    li   v1, 2\n    sys  0\n.align 16\ndata: .space 16\n"}},"inspector":{"key":"0x1234567890 const M64=(1n<<64n)-1n,rotl=(x,b)=>((x<<b)|(x>>(64n-b)))&M64;
function sip(key,bytes){let k0=key&M64,k1=(key>>64n)&M64;let v0=k0^0x736f6d6570736575n,v1=k1^0x646f72616e646f6dn,v2=k0^0x6c7967656e657261n,v3=k1^0x7465646279746573n;

  const n=bytes.length,full=n-n%8;for(let i=0;i<full;i+=8){let m=0n;for(let j=7;j>=0;j--)m=(m<<8n)|BigInt(bytes[i+j]);v3^=m;rnd();rnd();v0^=m}
  let m=BigInt(n)<<56n;for(let j=n-1;j>=full;j--)m|=BigInt(bytes[j])<<BigInt(8*(j-full));v3^=m;rnd();rnd();v0^=m;v2^=0xffn;rnd();rnd();rnd();rnd();return (v0^v1^v2^v3)&M64}
const bodyBytes=b=>{const a=[];for(let i=0;i<11;i++)a.push(Number((b>>BigInt(8*i))&255n));return a};
const mac=(key,body)=>sip(key,bodyBytes(body))>>24n;
